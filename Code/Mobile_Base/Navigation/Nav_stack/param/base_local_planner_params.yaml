TrajectoryPlannerROS:
  # The max and min forward velocity allowed for the base in meters/sec 
  #max_vel_x: 0.2363 # PWM = 100 
  max_vel_x: 0.3
  #min_vel_x: 0.2123 # PWM = 80 (not enough to move robot in some conditions)
  #min_vel_x: 0.22
  min_vel_x: 0.15
  #max_vel_theta: 0.05
  #min_vel_theta: -0.05
  min_in_place_vel_theta: 0.2
  max_vel_theta: 0.8
  min_vel_theta: -0.8
  

  acc_lim_theta: 1.5
  acc_lim_x: 0.5
  #acc_lim_Y: 0.25

  holonomic_robot: false

  meter_scoring: true

  xy_goal_tolerance: 0.15
  yaw_goal_tolerance: 0.25

